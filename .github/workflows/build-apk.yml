name: Build SAM WALLET APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SamWallet.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamWallet-APK
          path: SamWallet.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SAM WALLET v1.0.0
          body: |
            SAM WALLET Android APK.
            Install the APK directly on your Android device.
          files: SamWallet.apk
          make_latest: true
